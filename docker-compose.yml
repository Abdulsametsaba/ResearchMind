# ==============================================================================
# ResearchMind - Docker Compose Tam Stack Yapılandırması
# ==============================================================================
# Bu dosya, ResearchMind projesinin tüm servislerini (PostgreSQL + pgvector,
# FastAPI REST API) tek komutla ayağa kaldırır.
#
# Başlatmak için (tüm stack):
#   docker compose up -d
#
# Yalnızca veritabanı:
#   docker compose up -d postgres
#
# API loglarını izlemek için:
#   docker compose logs -f api
#
# Durdurmak için:
#   docker compose down
#
# NOT: .env dosyasındaki değişkenler otomatik okunur.
# ==============================================================================

services:
  # ─── ResearchMind FastAPI Servisi ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchmind-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
